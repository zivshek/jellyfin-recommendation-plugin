<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Recommendations</title>
</head>
<body>
    <div id="RecommendationsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="RecommendationsConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="RecommendationCollectionName">Recommendation Collection Name</label>
                        <input id="RecommendationCollectionName" name="RecommendationCollectionName" type="text" is="emby-input" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="RecommendationLimit">Recommendation Limit</label>
                        <input id="RecommendationLimit" name="RecommendationLimit" type="number" is="emby-input" min="1" max="100" />
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="IncludeWatchedItems" name="IncludeWatchedItems" type="checkbox" is="emby-checkbox" />
                            <span>Include watched items</span>
                        </label>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="LlmProvider">LLM Provider</label>
                        <select is="emby-select" id="LlmProvider" name="LlmProvider" class="emby-select-withcolor emby-select">
                            <option value="openai-compatible">OpenAI-compatible</option>
                            <option value="disabled">Disabled</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="LlmBaseUrl">LLM Base URL</label>
                        <input id="LlmBaseUrl" name="LlmBaseUrl" type="url" is="emby-input" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="LlmApiKey">LLM API Key</label>
                        <input id="LlmApiKey" name="LlmApiKey" type="password" is="emby-input" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="LlmModel">LLM Model</label>
                        <input id="LlmModel" name="LlmModel" type="text" is="emby-input" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="DoubanUserId">Douban User ID</label>
                        <input id="DoubanUserId" name="DoubanUserId" type="text" is="emby-input" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="DoubanExportPath">Douban Export Path</label>
                        <input id="DoubanExportPath" name="DoubanExportPath" type="text" is="emby-input" />
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="DoubanSyncProvider">Douban Sync Provider</label>
                        <select is="emby-select" id="DoubanSyncProvider" name="DoubanSyncProvider" class="emby-select-withcolor emby-select">
                            <option value="csv">CSV/JSON import</option>
                            <option value="disabled">Disabled</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="DoubanSyncIntervalHours">Douban Sync Interval Hours</label>
                        <input id="DoubanSyncIntervalHours" name="DoubanSyncIntervalHours" type="number" is="emby-input" min="1" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="ScheduledRefreshIntervalHours">Scheduled Refresh Interval Hours</label>
                        <input id="ScheduledRefreshIntervalHours" name="ScheduledRefreshIntervalHours" type="number" is="emby-input" min="1" />
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
                <div class="verticalSection">
                    <div class="selectContainer">
                        <label class="selectLabel" for="RecommendationsManualUserId">User</label>
                        <select id="RecommendationsManualUserId" class="emby-select-withcolor emby-select"></select>
                    </div>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsRebuildIndex">
                        <span>Rebuild Index</span>
                    </button>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsImportDouban">
                        <span>Import Douban Export</span>
                    </button>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsMatchDouban">
                        <span>Match Douban Items</span>
                    </button>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsGenerate">
                        <span>Generate Recommendations</span>
                    </button>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsUpdateCollection">
                        <span>Update Collection</span>
                    </button>
                    <button is="emby-button" type="button" class="raised block emby-button" id="RecommendationsRefresh">
                        <span>Generate and Update Collection</span>
                    </button>
                    <div id="RecommendationsStatus" class="fieldDescription"></div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            var RecommendationsConfig = {
                pluginUniqueId: 'e72f3148-e8c8-4f3c-a3f1-3cbce4487b8f',
                fields: [
                    'RecommendationCollectionName',
                    'RecommendationLimit',
                    'IncludeWatchedItems',
                    'LlmProvider',
                    'LlmBaseUrl',
                    'LlmApiKey',
                    'LlmModel',
                    'DoubanUserId',
                    'DoubanExportPath',
                    'DoubanSyncProvider',
                    'DoubanSyncIntervalHours',
                    'ScheduledRefreshIntervalHours'
                ]
            };

            document.querySelector('#RecommendationsConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(RecommendationsConfig.pluginUniqueId).then(function(config) {
                        RecommendationsConfig.fields.forEach(function(field) {
                            var element = document.querySelector('#' + field);
                            if (element.type === 'checkbox') {
                                element.checked = !!config[field];
                            } else {
                                element.value = config[field] || '';
                            }
                        });
                        loadRecommendationUsers();
                        loadRecommendationsStatus();
                        Dashboard.hideLoadingMsg();
                    }, handleRecommendationsError);
                });

            document.querySelector('#RecommendationsConfigForm')
                .addEventListener('submit', function(e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(RecommendationsConfig.pluginUniqueId).then(function(config) {
                        RecommendationsConfig.fields.forEach(function(field) {
                            var element = document.querySelector('#' + field);
                            config[field] = element.type === 'checkbox' ? element.checked : element.value;
                        });
                        config.DoubanSyncIntervalHours = parseInt(config.DoubanSyncIntervalHours, 10) || 24;
                        config.RecommendationLimit = parseInt(config.RecommendationLimit, 10) || 20;
                        config.ScheduledRefreshIntervalHours = parseInt(config.ScheduledRefreshIntervalHours, 10) || 24;
                        ApiClient.updatePluginConfiguration(RecommendationsConfig.pluginUniqueId, config).then(function(result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                            loadRecommendationsStatus();
                        }, handleRecommendationsError);
                    }, handleRecommendationsError);
                    e.preventDefault();
                    return false;
                });

            function setRecommendationsStatus(message) {
                document.querySelector('#RecommendationsStatus').innerText = message;
            }

            function handleRecommendationsError(error) {
                Dashboard.hideLoadingMsg();
                var message = 'Action failed.';
                if (error) {
                    if (error.responseJSON && (error.responseJSON.message || error.responseJSON.Message)) {
                        message = error.responseJSON.message || error.responseJSON.Message;
                    } else if (error.responseText) {
                        message = error.responseText;
                    } else if (error.statusText) {
                        message = error.statusText;
                    } else if (error.message) {
                        message = error.message;
                    }
                }

                setRecommendationsStatus(message);
            }

            function readProperty(value, camelName, pascalName, fallback) {
                if (!value) {
                    return fallback;
                }

                if (value[camelName] !== undefined && value[camelName] !== null) {
                    return value[camelName];
                }

                if (value[pascalName] !== undefined && value[pascalName] !== null) {
                    return value[pascalName];
                }

                return fallback;
            }

            function getResultMessage(result) {
                return readProperty(result, 'message', 'Message', 'Done');
            }

            function getResultSuccess(result) {
                return readProperty(result, 'success', 'Success', true);
            }

            function postRecommendationsAction(path, body) {
                Dashboard.showLoadingMsg();
                return ApiClient.ajax({
                    type: 'POST',
                    url: ApiClient.getUrl('Recommendations/' + path),
                    data: JSON.stringify(body || {}),
                    contentType: 'application/json'
                }).then(function(result) {
                    setRecommendationsStatus(getResultMessage(result));
                    Dashboard.hideLoadingMsg();
                    if (getResultSuccess(result)) {
                        loadRecommendationsStatus();
                    }
                }, handleRecommendationsError);
            }

            function getSelectedUserId() {
                var value = document.querySelector('#RecommendationsManualUserId').value;
                if (!value) {
                    throw new Error('Select a Jellyfin user before running this action.');
                }

                return value;
            }

            function loadRecommendationUsers() {
                var select = document.querySelector('#RecommendationsManualUserId');
                select.innerHTML = '';
                var loadingOption = document.createElement('option');
                loadingOption.value = '';
                loadingOption.innerText = 'Loading users...';
                select.appendChild(loadingOption);
                return ApiClient.ajax({
                    type: 'GET',
                    url: ApiClient.getUrl('Recommendations/Users')
                }).then(function(users) {
                    populateRecommendationUsers(users);
                }, function(error) {
                    if (typeof ApiClient.getUsers === 'function') {
                        return ApiClient.getUsers().then(populateRecommendationUsers, handleRecommendationsError);
                    }

                    handleRecommendationsError(error);
                });
            }

            function populateRecommendationUsers(users) {
                var userList = users || [];
                if (userList.items || userList.Items) {
                    userList = userList.items || userList.Items;
                }

                if (!Array.isArray(userList)) {
                    userList = [];
                }

                var previousValue = document.querySelector('#RecommendationsManualUserId').value;
                var sortedUsers = userList.slice().sort(function(left, right) {
                    var leftName = readProperty(left, 'name', 'Name', readProperty(left, 'username', 'Username', ''));
                    var rightName = readProperty(right, 'name', 'Name', readProperty(right, 'username', 'Username', ''));
                    return leftName.localeCompare(rightName);
                });

                var select = document.querySelector('#RecommendationsManualUserId');
                select.innerHTML = '';
                sortedUsers.forEach(function(user) {
                        var id = readProperty(user, 'id', 'Id', '');
                        if (!id) {
                            return;
                        }

                        var option = document.createElement('option');
                        option.value = id;
                        option.innerText = readProperty(user, 'name', 'Name', readProperty(user, 'username', 'Username', id));
                        select.appendChild(option);
                    });

                if (select.options.length === 0) {
                    var emptyOption = document.createElement('option');
                    emptyOption.value = '';
                    emptyOption.innerText = 'No users found';
                    select.appendChild(emptyOption);
                }

                if (previousValue) {
                    select.value = previousValue;
                }

                if (!select.value && select.options.length > 0) {
                        select.selectedIndex = 0;
                    }
            }

            function getSelectedUserBody() {
                try {
                    return { userId: getSelectedUserId() };
                } catch (error) {
                    handleRecommendationsError(error);
                    return null;
                }
            }

            function loadRecommendationsStatus() {
                ApiClient.ajax({
                    type: 'GET',
                    url: ApiClient.getUrl('Recommendations/Status')
                }).then(function(status) {
                    var libraryItemCount = readProperty(status, 'libraryItemCount', 'LibraryItemCount', 0);
                    var doubanItemCount = readProperty(status, 'doubanItemCount', 'DoubanItemCount', 0);
                    var recommendationRunCount = readProperty(status, 'recommendationRunCount', 'RecommendationRunCount', 0);
                    var lastLibraryIndexedAt = readProperty(status, 'lastLibraryIndexedAt', 'LastLibraryIndexedAt', null);
                    var lastDoubanImportAt = readProperty(status, 'lastDoubanImportAt', 'LastDoubanImportAt', null);
                    var lastRecommendationRunAt = readProperty(status, 'lastRecommendationRunAt', 'LastRecommendationRunAt', null);
                    var lastRecommendationStatus = readProperty(status, 'lastRecommendationStatus', 'LastRecommendationStatus', '');
                    var lastLibrary = lastLibraryIndexedAt
                        ? ' | Library indexed: ' + lastLibraryIndexedAt
                        : ' | Library indexed: never';
                    var lastDouban = lastDoubanImportAt
                        ? ' | Douban import: ' + lastDoubanImportAt
                        : ' | Douban import: never';
                    var lastRun = lastRecommendationRunAt
                        ? ' | Last run: ' + lastRecommendationStatus + ' at ' + lastRecommendationRunAt
                        : ' | Last run: never';
                    document.querySelector('#RecommendationsStatus').innerText =
                        'Library items: ' + libraryItemCount +
                        ' | Douban items: ' + doubanItemCount +
                        ' | Runs: ' + recommendationRunCount +
                        lastLibrary +
                        lastDouban +
                        lastRun;
                }, handleRecommendationsError);
            }

            document.querySelector('#RecommendationsRebuildIndex')
                .addEventListener('click', function() {
                    postRecommendationsAction('RebuildIndex');
                });

            document.querySelector('#RecommendationsImportDouban')
                .addEventListener('click', function() {
                    var body = getSelectedUserBody();
                    if (body) {
                        body.path = document.querySelector('#DoubanExportPath').value;
                        postRecommendationsAction('ImportDouban', body);
                    }
                });

            document.querySelector('#RecommendationsRefresh')
                .addEventListener('click', function() {
                    var body = getSelectedUserBody();
                    if (body) {
                        postRecommendationsAction('Refresh', body);
                    }
                });

            document.querySelector('#RecommendationsGenerate')
                .addEventListener('click', function() {
                    var body = getSelectedUserBody();
                    if (body) {
                        postRecommendationsAction('Generate', body);
                    }
                });

            document.querySelector('#RecommendationsUpdateCollection')
                .addEventListener('click', function() {
                    var body = getSelectedUserBody();
                    if (body) {
                        postRecommendationsAction('UpdateCollection', body);
                    }
                });

            document.querySelector('#RecommendationsMatchDouban')
                .addEventListener('click', function() {
                    var body = getSelectedUserBody();
                    if (body) {
                        postRecommendationsAction('MatchDouban', body);
                    }
                });
        </script>
    </div>
</body>
</html>
