name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test Jellyfin.Plugin.Recommendations.sln --configuration Release

      - name: Resolve release tag
        id: release-tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package plugin and repository manifest
        shell: pwsh
        run: .\scripts\package-release.ps1 -Repository "${{ github.repository }}" -Tag "${{ steps.release-tag.outputs.tag }}"

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release-tag.outputs.tag }}"
          $zip = Get-ChildItem -LiteralPath artifacts\repository -Filter *.zip | Select-Object -First 1
          $manifest = "artifacts\repository\manifest.json"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Jellyfin Recommendations plugin $tag"
          }

          gh release upload $tag $zip.FullName $manifest --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-recommendations-release
          path: |
            artifacts/repository/*.zip
            artifacts/repository/manifest.json

      - name: Prepare GitHub Pages repository manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public | Out-Null
          Copy-Item -LiteralPath artifacts\repository\manifest.json -Destination public\manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages repository manifest
        id: deployment
        uses: actions/deploy-pages@v4
