name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Recommendations.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.Recommendations.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.Recommendations.sln --configuration Release --no-build

      - name: Package release artifacts
        shell: pwsh
        run: .\scripts\package-release.ps1 -Repository "${{ github.repository }}" -Tag "ci-${{ github.run_number }}" -Version "0.1.0"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-recommendations-package
          path: |
            artifacts/repository/*.zip
            artifacts/repository/manifest.json
